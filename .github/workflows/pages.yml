name: Deploy to GitHub Pages

# Requires Pages to be switched on once, by hand:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# The workflow token is not allowed to create the Pages site itself.

on:
  push:
    branches:
      - main
      - claude/depth-miner-game-xl8pc1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
